name: 每日数据更新

on:
  schedule:
    # GitHub Actions 使用 UTC；00:15 UTC = 北京时间 08:15。
    - cron: '15 0 * * *'
  workflow_dispatch:

concurrency:
  group: daily-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装行情依赖
        run: pip install --disable-pip-version-check yfinance

      - name: 运行数据更新脚本
        run: python scripts/update_data.py

      - name: 验证中文内容和 JSON 格式
        run: |
          python -m json.tool data/data.json > /dev/null
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(Path('data/data.json').read_text(encoding='utf-8'))
          assert data.get('last_updated'), '缺少更新时间'
          assert len(data.get('ai_news', [])) >= 3, 'AI 新闻数量不足'
          assert len(data.get('economy', [])) >= 3, '经济新闻数量不足'
          for section in ('ai_news', 'economy'):
              for item in data[section]:
                  assert re.search(r'[\u3400-\u9fff]', item.get('title', '')), f'{section} 存在非中文标题'
                  assert item.get('image'), f'{section} 存在缺少图片的条目'
          PY

      - name: 提交并推送更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/data.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "每日数据更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d')"
            git push
          fi
